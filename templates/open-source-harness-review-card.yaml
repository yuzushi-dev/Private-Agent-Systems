# Open-source harness review card: template from "Private Agent Systems" (Appendix B).
# Use when reviewing a fast-moving open-source agent project. The decision is not
# limited to adopt or reject: many projects are best used as pattern references,
# testbeds, or watchlist signals. Replace placeholders with project-specific evidence.
open_source_harness_review:
  project: ""
  repository: ""
  license: "unknown"
  category: adopt | adapt | observe | avoid
  primary_archetype:
